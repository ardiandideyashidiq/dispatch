# Builds release binaries with the nightly Rust toolchain on every push to main
# (and on a daily schedule), then publishes them to a rolling "nightly"
# prerelease. Unlike release.yml, the tag always points at the newest build.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin="dispatch"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="dispatch.exe"
          fi
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/$bin" "staging/$bin"
          tar -czf "dispatch-nightly-${{ matrix.name }}.tar.gz" -C staging "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-nightly-${{ matrix.name }}
          path: dispatch-nightly-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly artifacts/*.tar.gz \
            --target "${{ github.sha }}" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --prerelease \
            --notes "Automated nightly build of \`${{ github.sha }}\` with the nightly Rust toolchain.

          Targets: Linux x86_64, Windows x86_64, macOS x86_64, macOS aarch64."
